[package]
name = "ms900ctl"
version = "0.1.0"
edition = "2021"
description = "Native Linux configuration tool for the Havit MS900 (Sinowealth 258a:0029) gaming mouse"
license = "MIT"

[dependencies]
eframe = { version = "0.36", default-features = false, features = ["default_fonts", "glow", "wayland", "x11"] }
egui = "0.36"
egui_extras = { version = "0.36", features = ["image"] }
image = { version = "0.25", default-features = false, features = ["png", "bmp", "ico"] }
hidapi = { version = "2.6", default-features = false, features = ["linux-static-hidraw"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
log = "0.4"
env_logger = "0.11"
dirs = "6"
rfd = { version = "0.15", default-features = false, features = ["xdg-portal", "tokio"] }
tokio = { version = "1", features = ["rt", "rt-multi-thread"] }

[profile.release]
opt-level = 2
lto = "thin"
strip = true
